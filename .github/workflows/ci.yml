name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      # Retry up to 3x for flaky timing-dependent tests in injectClient.test.ts
      # (FakePty + setImmediate ordering races on slower runners).
      # TODO: stabilize the tests themselves and drop the retry.
      - run: npx vitest run --retry=3
      - run: npm run build
